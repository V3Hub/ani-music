packages:
  - 'apps/*'

# 允许这些依赖执行 postinstall 构建脚本（pnpm 12 默认拦截）
# 说明：onlyBuiltDependencies 已被弃用，统一用 allowBuilds
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true

# pnpm 12 供应链安全基线（.npmrc 的 trust-policy=off 会覆盖此项）
minimumReleaseAgeExcludePrune: true
