<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ani-hub 反代</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #0f0f10;
        color: #eee;
        padding: 28px;
        max-width: 760px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p.sub {
        color: #888;
        font-size: 13px;
        margin: 0 0 20px;
      }
      .card {
        background: #1a1a1c;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .card h2 {
        font-size: 12px;
        color: #999;
        margin: 0 0 10px;
        letter-spacing: 1px;
      }
      input[type='text'] {
        width: 100%;
        background: #111;
        border: 1px solid #333;
        color: #eee;
        padding: 10px 12px;
        border-radius: 6px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        box-sizing: border-box;
      }
      button {
        margin-top: 10px;
        background: #4f46e5;
        color: #fff;
        border: 0;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button:disabled {
        background: #444;
        cursor: not-allowed;
      }
      pre {
        background: #111;
        border: 1px solid #222;
        border-radius: 6px;
        padding: 12px;
        overflow: auto;
        font-size: 12px;
        max-height: 260px;
        margin: 0;
      }
      code {
        background: #222;
        padding: 2px 5px;
        border-radius: 4px;
        font-size: 12px;
      }
      .hint {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
        word-break: break-all;
      }
      .ok {
        color: #4ade80;
      }
      .err {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <h1>ani-hub 反代</h1>
    <p class="sub">Cloudflare Worker → Vercel Edge → buguyy.top</p>

    <div class="card">
      <h2>测试 /api/proxy</h2>
      <input type="text" id="t" value="https://www.buguyy.top/api/search?keyword=%E7%88%B1%E4%BD%A0" />
      <button id="btn" onclick="run()">测试</button>
      <div class="hint" id="direct"></div>
    </div>

    <div class="card">
      <h2>响应</h2>
      <pre id="out">点击「测试」查看结果</pre>
    </div>

    <script>
      var out = document.getElementById('out')
      var btn = document.getElementById('btn')
      var input = document.getElementById('t')
      var direct = document.getElementById('direct')

      function build() {
        return location.origin + '/api/proxy?target=' + encodeURIComponent(input.value)
      }
      function refresh() {
        direct.textContent = build()
      }
      refresh()
      input.addEventListener('input', refresh)

      function run() {
        var url = build()
        btn.disabled = true
        btn.textContent = '测试中…'
        out.textContent = '请求：' + url + '\n'
        fetch(url)
          .then(function (r) {
            return r.text().then(function (text) {
              var data
              try {
                data = JSON.parse(text)
              } catch (e) {
                data = text
              }
              out.innerHTML =
                '<span class="' +
                (r.ok ? 'ok' : 'err') +
                '">status ' +
                r.status +
                '</span>\n' +
                'content-type: ' +
                r.headers.get('content-type') +
                '\n' +
                'length: ' +
                text.length +
                '\n\n'
              out.textContent += JSON.stringify(data, null, 2).slice(0, 2500)
            })
          })
          .catch(function (e) {
            out.innerHTML = '<span class="err">请求失败：' + e.message + '</span>'
          })
          .then(function () {
            btn.disabled = false
            btn.textContent = '测试'
          })
      }
    </script>
  </body>
</html>
